<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Novamart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark navbar-top">
    <div class="container justify-content-center">
      <a class="navbar-brand brand-logo" href="index.html">
        <i class="bi bi-cart4 text-warning"></i> Nova<span class="logo-accent">mart</span>
      </a>
    </div>
  </nav>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card border-0 shadow-sm rounded-3 p-4 bg-white">
            <h3 class="fw-bold mb-1 text-center">Create Your Account</h3>
            <p class="text-muted text-center small mb-4">Start enjoying personalized shopping and deals</p>

            <div class="alert alert-danger d-none small py-2" id="registerAlert"></div>

            <form id="registerForm">
              <div class="mb-3">
                <label class="form-label fw-semibold small">Full Name *</label>
                <input type="text" class="form-control" id="regName" required placeholder="e.g. Jane Doe">
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold small">Email Address *</label>
                <input type="email" class="form-control" id="regEmail" required placeholder="name@example.com">
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold small">Phone Number</label>
                <input type="tel" class="form-control" id="regPhone" placeholder="+91 9876543210">
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold small">Password * (min. 6 characters)</label>
                <input type="password" class="form-control" id="regPassword" required minlength="6" placeholder="Choose a secure password">
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold small">Confirm Password *</label>
                <input type="password" class="form-control" id="regConfirmPassword" required minlength="6" placeholder="Repeat your password">
              </div>

              <div class="d-grid mb-3">
                <button type="submit" class="btn btn-warning fw-bold py-2" id="registerSubmitBtn">
                  Create Account
                </button>
              </div>
            </form>

            <div class="text-center small mt-3">
              <span class="text-muted">Already registered?</span>
              <a href="login.html" class="fw-bold text-decoration-none ms-1">Sign in here</a>
            </div>

          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-3 mt-auto">
    <div class="container text-center">
      <p class="mb-0 text-secondary small">&copy; 2026 Novamart Inc. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
