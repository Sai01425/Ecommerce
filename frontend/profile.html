<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — Novamart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-top sticky-top">
    <div class="container">
      <a class="navbar-brand brand-logo" href="index.html">
        <i class="bi bi-cart4 text-warning"></i> Nova<span class="logo-accent">mart</span>
      </a>

      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMainContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMainContent">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-1">
          <li class="nav-item"><a class="nav-link nav-link-custom" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link nav-link-custom" href="products.html">Products</a></li>
          <li class="nav-item"><a class="nav-link nav-link-custom" href="orders.html">My Orders</a></li>
          <li class="nav-item">
            <a class="nav-link nav-link-custom cart-btn-link" href="cart.html">
              <i class="bi bi-cart3 fs-5"></i>
              <span class="d-lg-none">Cart</span>
              <span class="cart-badge-pill" id="cartBadge">0</span>
            </a>
          </li>
          <li class="nav-item ms-lg-2" id="navUserContainer">
            <a href="login.html" class="btn btn-outline-light btn-sm px-3">Sign In</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="py-4">
    <div class="container">
      <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb small">
          <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none">Home</a></li>
          <li class="breadcrumb-item active" aria-current="page">Account Profile</li>
        </ol>
      </nav>

      <div class="row g-4">
        <!-- User Info Card -->
        <div class="col-lg-4">
          <div class="card border-0 shadow-sm rounded-3 p-4 text-center">
            <div class="mb-3">
              <i class="bi bi-person-circle fs-1 text-primary" style="font-size: 5rem !important;"></i>
            </div>
            <h4 class="fw-bold mb-1" id="profileNameDisplay">User Name</h4>
            <p class="text-muted small mb-2" id="profileEmailDisplay">user@example.com</p>
            <div>
              <span class="badge bg-primary" id="profileRoleBadge">Customer</span>
            </div>
            <hr class="my-4">
            <div class="d-grid gap-2">
              <a href="orders.html" class="btn btn-outline-primary btn-sm">
                <i class="bi bi-box-seam me-1"></i> View Order History
              </a>
              <a href="cart.html" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-cart me-1"></i> View Shopping Cart
              </a>
            </div>
          </div>
        </div>

        <!-- Edit Profile & Change Password -->
        <div class="col-lg-8">
          <!-- Update Info Form -->
          <div class="card border-0 shadow-sm rounded-3 p-4 mb-4">
            <h5 class="fw-bold mb-3 border-bottom pb-2">Edit Personal Information</h5>
            <form id="editProfileForm">
              <div class="mb-3">
                <label class="form-label small fw-semibold">Full Name *</label>
                <input type="text" class="form-control" id="editName" required>
              </div>
              <div class="mb-3">
                <label class="form-label small fw-semibold">Contact Phone Number</label>
                <input type="tel" class="form-control" id="editPhone" placeholder="+91 9876543210">
              </div>
              <button type="submit" class="btn btn-primary fw-semibold px-4">Save Changes</button>
            </form>
          </div>

          <!-- Update Password Form -->
          <div class="card border-0 shadow-sm rounded-3 p-4">
            <h5 class="fw-bold mb-3 border-bottom pb-2">Change Password</h5>
            <div class="alert alert-danger d-none small py-2" id="passwordAlert"></div>
            <form id="changePasswordForm">
              <div class="mb-3">
                <label class="form-label small fw-semibold">Current Password *</label>
                <input type="password" class="form-control" id="currentPassword" required placeholder="Enter current password">
              </div>
              <div class="mb-3">
                <label class="form-label small fw-semibold">New Password * (min. 6 characters)</label>
                <input type="password" class="form-control" id="newPassword" required minlength="6" placeholder="Enter new password">
              </div>
              <div class="mb-3">
                <label class="form-label small fw-semibold">Confirm New Password *</label>
                <input type="password" class="form-control" id="confirmNewPassword" required minlength="6" placeholder="Confirm new password">
              </div>
              <button type="submit" class="btn btn-warning fw-bold px-4">Update Password</button>
            </form>
          </div>
        </div>

      </div>
    </div>
  </main>

  <footer>
    <div class="container text-center">
      <p class="mb-0 text-secondary small">&copy; 2026 Novamart Inc. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
