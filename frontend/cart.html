<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart — Novamart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-top sticky-top">
    <div class="container">
      <a class="navbar-brand brand-logo" href="index.html">
        <i class="bi bi-cart4 text-warning"></i> Nova<span class="logo-accent">mart</span>
      </a>

      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMainContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMainContent">
        <form class="d-flex mx-auto nav-search-bar my-2 my-lg-0" id="globalSearchForm">
          <div class="input-group">
            <input class="form-control" type="search" id="globalSearchInput" placeholder="Search products..." aria-label="Search">
            <button class="btn btn-search" type="submit">
              <i class="bi bi-search me-1"></i> Search
            </button>
          </div>
        </form>

        <ul class="navbar-nav align-items-lg-center gap-1">
          <li class="nav-item"><a class="nav-link nav-link-custom" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link nav-link-custom" href="products.html">Products</a></li>
          <li class="nav-item"><a class="nav-link nav-link-custom" href="orders.html">My Orders</a></li>
          <li class="nav-item">
            <a class="nav-link nav-link-custom cart-btn-link active" href="cart.html">
              <i class="bi bi-cart3 fs-5"></i>
              <span class="d-lg-none">Cart</span>
              <span class="cart-badge-pill" id="cartBadge">0</span>
            </a>
          </li>
          <li class="nav-item ms-lg-2" id="navUserContainer">
            <a href="login.html" class="btn btn-outline-light btn-sm px-3">Sign In</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="py-4">
    <div class="container">
      <!-- Breadcrumb -->
      <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb small">
          <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none">Home</a></li>
          <li class="breadcrumb-item active" aria-current="page">Shopping Cart</li>
        </ol>
      </nav>

      <!-- Cart Dynamic Container -->
      <div id="cartMainContainer">
        <div class="col-12 text-center py-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading cart...</span>
          </div>
          <p class="mt-2 text-muted">Retrieving cart contents...</p>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container text-center">
      <p class="mb-0 text-secondary small">&copy; 2026 Novamart Inc. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
