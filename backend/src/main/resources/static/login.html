<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Novamart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark navbar-top">
    <div class="container justify-content-center">
      <a class="navbar-brand brand-logo" href="index.html">
        <i class="bi bi-cart4 text-warning"></i> Nova<span class="logo-accent">mart</span>
      </a>
    </div>
  </nav>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card border-0 shadow-sm rounded-3 p-4 bg-white">
            <h3 class="fw-bold mb-1 text-center">Welcome Back</h3>
            <p class="text-muted text-center small mb-4">Sign in to your account to continue shopping</p>

            <div class="alert alert-danger d-none small py-2" id="loginAlert"></div>

            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label fw-semibold small">Email Address</label>
                <input type="email" class="form-control" id="loginEmail" required placeholder="name@example.com">
              </div>

              <div class="mb-3">
                <div class="d-flex justify-content-between">
                  <label class="form-label fw-semibold small">Password</label>
                </div>
                <input type="password" class="form-control" id="loginPassword" required placeholder="Enter your password">
              </div>

              <div class="d-grid mb-3">
                <button type="submit" class="btn btn-warning fw-bold py-2" id="loginSubmitBtn">
                  Sign In
                </button>
              </div>
            </form>

            <div class="position-relative text-center my-3">
              <hr class="text-muted">
              <span class="position-absolute top-50 start-50 translate-middle bg-white px-2 small text-muted">Quick Demo Access</span>
            </div>

            <!-- Quick Demo Login Buttons -->
            <div class="row g-2 mb-3">
              <div class="col-6">
                <button type="button" class="btn btn-outline-primary btn-sm w-100 fw-semibold" id="btnDemoCustomer">
                  <i class="bi bi-person me-1"></i> Demo Customer
                </button>
              </div>
              <div class="col-6">
                <button type="button" class="btn btn-outline-danger btn-sm w-100 fw-semibold" id="btnDemoAdmin">
                  <i class="bi bi-shield-lock me-1"></i> Demo Admin
                </button>
              </div>
            </div>

            <div class="text-center small mt-3">
              <span class="text-muted">Don't have an account?</span>
              <a href="register.html" class="fw-bold text-decoration-none ms-1">Create one here</a>
            </div>

          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-3 mt-auto">
    <div class="container text-center">
      <p class="mb-0 text-secondary small">&copy; 2026 Novamart. Secure Java Spring Boot & BCrypt Authentication.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
