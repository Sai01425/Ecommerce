# Server Configuration
server.port=8080

# Spring Application Name
spring.application.name=ecommerce-backend

# Database Configuration (MySQL with fallback env vars)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Static Resources for Single-Port Serving
spring.web.resources.static-locations=classpath:/static/

# JWT Configuration
# Base64-encoded 256-bit HMAC secret
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-milliseconds=86400000

# Default Seed Administrator Credentials (Overridable via environment variables)
app.admin.name=${ADMIN_NAME:Administrator}
app.admin.email=${ADMIN_EMAIL:admin@ecommerce.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}

# Logging
logging.level.com.example.ecommerce=INFO
logging.level.org.springframework.security=WARN
